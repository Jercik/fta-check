---
name: Release npm

# Copies each release of the Forge package fta-check to npmjs under the
# unscoped name. The Forge is the only release engine: the publish job waits for the
# Forge release of the tag, requires the Forge tarball to be the one that release's
# own job built and recorded, repacks it and publishes it, so it can publish nothing
# the Forge has not released. It needs no secret: the Forge is read anonymously and
# npm authenticates the publish job through trusted publishing (OIDC).
#
# npm's trusted publisher for this package names this file and the environment
# "npm", whose only deployment branch rule is the branch main. Any tag reaches
# this repository through the push mirror, and a tag's run executes the tag's own copy
# of this file, so publishing never happens in a tag run: the hand-off job only asks
# for a publish run on main, whose copy of this file comes from the Forge's protected main.

on:
  push:
    tags:
      - "v*"
  # The publish entry point, also for re-runs and backfills:
  # gh workflow run release-npm.yml -R <owner>/<repo> --ref refs/heads/main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: Forge release tag to copy to npmjs (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  hand-off:
    name: Hand the tag to main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      REF: ${{ github.ref }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the publish run on main
        # Events caused by GITHUB_TOKEN start no workflow run, except workflow_dispatch and repository_dispatch.
        # The full ref, because git resolves a bare "main" to a tag of that name before the branch.
        run: |
          set -euo pipefail
          [[ "$REF" == "refs/tags/$TAG" && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$REF is not a release tag ref (refs/tags/vX.Y.Z)"; exit 1; }
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release-npm.yml/dispatches" \
            -d "{\"ref\":\"refs/heads/main\",\"inputs\":{\"tag\":\"$TAG\"}}"
          echo "Dispatched release-npm.yml on main for $TAG"

  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    # Trusted publishing needs a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub starts this job only on a ref the environment's deployment branch rule admits (main), and only then puts the environment into the OIDC token npm matches against.
    environment: npm
    concurrency:
      group: release-npm-publish-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      id-token: write
    env:
      REF: ${{ github.ref }}
      TAG: ${{ inputs.tag }}
      SCOPED: "@j4k-oss/fta-check"
      NAME: "fta-check"
      OSS: https://code.j4k.dev/api/packages/j4k-oss/npm/
      RELEASE_API: https://code.j4k.dev/api/v1/repos/j4k-oss/fta-check
      REPOSITORY_URL: git+https://github.com/${{ github.repository }}.git
    steps:
      # Trusted publishing needs npm >= 11.5.1, which the pinned Node line bundles; the next step asserts it.
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.5.0"

      - name: Resolve the version
        # The input is only ever used through this validated value.
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Publish runs only on main, not $REF; dispatch it with --ref refs/heads/main -f tag=vX.Y.Z"; exit 1; }
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::The tag input $TAG is not vX.Y.Z"; exit 1; }
          version=${BASH_REMATCH[1]}
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Read the integrity the Forge release recorded
        # The Forge release job attaches the integrity of the tarball it built and published as the release asset forge-tarball-integrity.txt, after the publish. Only a holder of the Forge repository's Actions token or a maintainer can attach it, commit text cannot, and the package registry needs a different principal, so a tarball without that record never reaches npmjs.
        run: |
          set -euo pipefail
          recorded="$RUNNER_TEMP/recorded-integrity"
          node --input-type=module - > "$recorded" <<'EOF'
          const { VERSION, RELEASE_API } = process.env;
          const ORIGIN = new URL(RELEASE_API).origin;
          const DEADLINE_MS = Date.now() + 15 * 60 * 1000;
          const POLL_MS = 20_000;
          async function readRecordedIntegrity(release, origin) {
            const named = (release.assets ?? []).filter((asset) => asset.name === "forge-tarball-integrity.txt");
            if (named.length === 0) {
              return undefined;
            }
            if (named.length > 1) {
              throw new Error("The Forge release " + release.tag_name + " has " + named.length + " assets named forge-tarball-integrity.txt");
            }
            const url = String(named[0].browser_download_url ?? "");
            if (!url.startsWith(origin + "/")) {
              throw new Error("forge-tarball-integrity.txt of " + release.tag_name + " is served from " + JSON.stringify(url) + ", not from " + origin);
            }
            const response = await fetch(url, { signal: AbortSignal.timeout(30_000) });
            if (!response.ok) {
              throw new Error("GET " + url + " returned " + response.status);
            }
            const value = (await response.text()).slice(0, 512).trim();
            if (!/^sha512-[A-Za-z0-9+/]{86}==$/u.test(value)) {
              throw new Error("forge-tarball-integrity.txt of " + release.tag_name + " holds " + JSON.stringify(value.slice(0, 120)) + ", not one sha512 integrity");
            }
            return value;
          }

          async function readRelease() {
            const url = RELEASE_API + "/releases/tags/v" + VERSION;
            const response = await fetch(url, { headers: { accept: "application/json" }, signal: AbortSignal.timeout(30_000) });
            if (response.status === 404) {
              return undefined;
            }
            if (!response.ok) {
              throw new Error("GET " + url + " returned " + response.status);
            }
            return response.json();
          }

          for (;;) {
            const release = await readRelease();
            const recorded = release === undefined ? undefined : await readRecordedIntegrity(release, ORIGIN);
            if (recorded !== undefined) {
              console.log(recorded);
              break;
            }
            if (Date.now() > DEADLINE_MS) {
              console.error("::error::The Forge release v" + VERSION + " has no forge-tarball-integrity.txt after 15 minutes, so " + VERSION + " did not come from the Forge release job");
              process.exit(1);
            }
            await new Promise((resolve) => setTimeout(resolve, POLL_MS));
          }
          EOF
          echo "RECORDED_INTEGRITY=$(cat "$recorded")" >> "$GITHUB_ENV"

      - name: Wait for the Forge package
        # The record is attached after the publish, so the version is normally there already.
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until npm view "$SCOPED@$VERSION" version "--@j4k-oss:registry=$OSS" > /dev/null 2>&1; do
            (( SECONDS < deadline )) || { echo "::error::$SCOPED@$VERSION not on $OSS"; exit 1; }
            sleep 20
          done

      - name: Repack the Forge tarball under the npm name
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge" && cd "$RUNNER_TEMP/forge"
          npm pack "$SCOPED@$VERSION" "--@j4k-oss:registry=$OSS" --loglevel=warn > /dev/null
          tarballs=(./*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] || { echo "::error::expected one tarball of $SCOPED@$VERSION"; exit 1; }
          integrity="$(node -e 'process.stdout.write("sha512-" + require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(process.argv[1])).digest("base64"))' "${tarballs[0]}")"
          [ "$integrity" = "$RECORDED_INTEGRITY" ] || { echo "::error::The Forge tarball of $SCOPED@$VERSION has integrity $integrity, not the $RECORDED_INTEGRITY its release recorded"; exit 1; }
          tar xzf "${tarballs[0]}" && cd package
          test "$(npm pkg get version)" = "\"$VERSION\""
          node -e 'const p=require("./package.json"); const d={...p.dependencies,...p.optionalDependencies,...p.peerDependencies}; const bad=Object.keys(d).filter(n=>/^@j4k(-oss)?\//.test(n)); if(bad.length){console.error("::error::runtime deps not on npmjs: "+bad); process.exit(1)}'
          # npm requires repository.url to match the GitHub repository exactly, and a kept publishConfig would send the publish back to the Forge.
          npm pkg set "name=$NAME" "repository.url=$REPOSITORY_URL"
          npm pkg delete publishConfig

      - name: Compare the copy with the Forge release
        # What is compared is what gets published: the version already on npmjs, or the packed repack. Either must equal the Forge tarball in every member except the package.json fields the repack step above rewrites.
        run: |
          set -euo pipefail
          forge_tarballs=("$RUNNER_TEMP"/forge/*.tgz)
          [ "${#forge_tarballs[@]}" -eq 1 ] || { echo "::error::expected one Forge tarball in $RUNNER_TEMP/forge"; exit 1; }
          if [ "$(npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org/ 2> /dev/null || true)" = "$VERSION" ]; then
            on_npm=true
            copy_dir="$RUNNER_TEMP/npm"
            mkdir -p "$copy_dir" && (cd "$copy_dir" && npm pack "$NAME@$VERSION" --registry https://registry.npmjs.org/ --loglevel=warn > /dev/null)
          else
            on_npm=false
            copy_dir="$RUNNER_TEMP/mirror"
            # --ignore-scripts: the package's prepack and prepare scripts cannot run in an unpacked tarball.
            mkdir -p "$copy_dir" && (cd "$RUNNER_TEMP/forge/package" && npm pack --ignore-scripts --pack-destination "$copy_dir" --loglevel=warn > /dev/null)
          fi
          copy_tarballs=("$copy_dir"/*.tgz)
          [ "${#copy_tarballs[@]}" -eq 1 ] || { echo "::error::expected one tarball in $copy_dir"; exit 1; }
          node --input-type=module - "${copy_tarballs[0]}" "${forge_tarballs[0]}" <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { isDeepStrictEqual } from "node:util";
          import { gunzipSync } from "node:zlib";

          const BLOCK_SIZE = 512;
          const MANIFEST_PATH = "package/package.json";
          const FILE_TYPES = new Set(["0", "\0", "7"]);
          const MEMBER_TYPES = new Set([...FILE_TYPES, "1", "2", "5"]);

          function readText(bytes) {
            const end = bytes.indexOf(0);
            return bytes.subarray(0, end === -1 ? bytes.length : end).toString("utf8");
          }

          function readOctal(bytes, field) {
            if ((bytes[0] ?? 0) & 0x80) {
              throw new Error("tar " + field + " uses the base-256 encoding, which npm tarballs never need");
            }
            const text = readText(bytes).trim();
            if (!/^[0-7]*$/u.test(text)) {
              throw new Error("tar " + field + " is not octal: " + JSON.stringify(text));
            }
            return text === "" ? 0 : Number.parseInt(text, 8);
          }

          function checksum(header) {
            let sum = 0;
            for (let index = 0; index < BLOCK_SIZE; index += 1) {
              sum += index >= 148 && index < 156 ? 0x20 : header[index];
            }
            return sum;
          }

          function parsePax(body) {
            const records = {};
            let offset = 0;
            while (offset < body.length) {
              const space = body.indexOf(0x20, offset);
              const length = Number.parseInt(body.subarray(offset, space).toString("utf8"), 10);
              if (space === -1 || !Number.isInteger(length) || length <= space - offset + 1 || offset + length > body.length) {
                throw new Error("tar has a malformed pax header");
              }
              const record = body.subarray(space + 1, offset + length - 1).toString("utf8");
              const equals = record.indexOf("=");
              records[record.slice(0, equals)] = record.slice(equals + 1);
              offset += length;
            }
            return records;
          }

          function readArchive(file) {
            const data = gunzipSync(readFileSync(file));
            const members = new Map();
            let offset = 0;
            let pax = {};
            let longPath;
            let longLink;
            let ended = false;
            while (offset + BLOCK_SIZE <= data.length) {
              const header = data.subarray(offset, offset + BLOCK_SIZE);
              if (header.every((byte) => byte === 0)) {
                ended = true;
                break;
              }
              if (readOctal(header.subarray(148, 156), "checksum") !== checksum(header)) {
                throw new Error("tar header at byte " + offset + " fails its checksum");
              }
              const size = readOctal(header.subarray(124, 136), "size");
              const type = String.fromCharCode(header[156]);
              const bodyStart = offset + BLOCK_SIZE;
              if (bodyStart + size > data.length) {
                throw new Error("tar is truncated inside a member");
              }
              const body = data.subarray(bodyStart, bodyStart + size);
              offset = bodyStart + Math.ceil(size / BLOCK_SIZE) * BLOCK_SIZE;
              if (type === "x") {
                pax = { ...pax, ...parsePax(body) };
                continue;
              }
              if (type === "L") {
                longPath = readText(body);
                continue;
              }
              if (type === "K") {
                longLink = readText(body);
                continue;
              }
              if (!MEMBER_TYPES.has(type)) {
                throw new Error("tar member of unsupported type " + JSON.stringify(type));
              }
              if (pax.size !== undefined) {
                throw new Error("tar pax size overrides are not supported");
              }
              const prefix = readText(header.subarray(345, 500));
              const ustar = readText(header.subarray(257, 263)) === "ustar";
              const name = pax.path ?? longPath ?? (ustar && prefix !== "" ? prefix + "/" : "") + readText(header.subarray(0, 100));
              if (members.has(name)) {
                throw new Error("tar holds " + name + " twice");
              }
              members.set(name, {
                type: FILE_TYPES.has(type) ? "file" : type,
                mode: readOctal(header.subarray(100, 108), "mode") & 0o7777,
                link: pax.linkpath ?? longLink ?? readText(header.subarray(157, 257)),
                sha256: createHash("sha256").update(body).digest("hex"),
                body,
              });
              pax = {};
              longPath = undefined;
              longLink = undefined;
            }
            if (!ended) {
              throw new Error(file + " has no tar end marker; it is truncated or not a tar archive");
            }
            if (members.size === 0) {
              throw new Error(file + " holds no members");
            }
            return members;
          }

          function describe(member) {
            return member.type + " mode " + member.mode.toString(8) + " sha256 " + member.sha256 + (member.link === "" ? "" : " -> " + member.link);
          }

          const { NAME, SCOPED, REPOSITORY_URL } = process.env;
          const [mirrorFile, forgeFile] = process.argv.slice(2);
          const mirror = readArchive(mirrorFile);
          const forge = readArchive(forgeFile);
          const failures = [];

          for (const path of new Set([...mirror.keys(), ...forge.keys()])) {
            const mirrored = mirror.get(path);
            const released = forge.get(path);
            if (mirrored === undefined || released === undefined) {
              failures.push(path + " is only in the " + (mirrored === undefined ? "Forge" : "npm") + " tarball");
            } else if (path !== MANIFEST_PATH && describe(mirrored) !== describe(released)) {
              failures.push(path + " differs: npm " + describe(mirrored) + ", Forge " + describe(released));
            } else if (path === MANIFEST_PATH && (mirrored.type !== "file" || released.type !== "file" || mirrored.mode !== released.mode)) {
              failures.push(path + " differs in type or mode: npm " + describe(mirrored) + ", Forge " + describe(released));
            }
          }

          const mirroredManifest = mirror.get(MANIFEST_PATH);
          const releasedManifest = forge.get(MANIFEST_PATH);
          if (mirroredManifest !== undefined && releasedManifest !== undefined) {
            const npm = JSON.parse(mirroredManifest.body.toString("utf8"));
            const released = JSON.parse(releasedManifest.body.toString("utf8"));
            if (npm.name !== NAME || released.name !== SCOPED) {
              failures.push("package names are " + npm.name + " (npm) and " + released.name + " (Forge), expected " + NAME + " and " + SCOPED);
            }
            if (npm.repository?.url !== REPOSITORY_URL) {
              failures.push("npm repository.url is " + npm.repository?.url + ", expected " + REPOSITORY_URL);
            }
            if (npm.publishConfig !== undefined) {
              failures.push("the npm copy kept publishConfig");
            }
            for (const manifest of [npm, released]) {
              delete manifest.name;
              delete manifest.repository?.url;
              delete manifest.publishConfig;
            }
            if (!isDeepStrictEqual(npm, released)) {
              failures.push("package.json differs beyond name, repository.url and publishConfig");
            }
          }

          for (const failure of failures) {
            console.error("::error::" + failure);
          }
          if (failures.length > 0) {
            process.exit(1);
          }
          console.log("ok: " + mirror.size + " archive members match, package.json differs only in name, repository.url and publishConfig");
          EOF
          echo "ON_NPM=$on_npm" >> "$GITHUB_ENV"
          if [ "$on_npm" = true ]; then
            echo "$NAME@$VERSION already on npmjs with identical files"
          fi

      - name: Publish
        if: env.ON_NPM == 'false'
        working-directory: ${{ runner.temp }}/forge/package
        run: |
          set -euo pipefail
          # Publishing a version below npm's latest with the default tag would move latest backwards.
          forge_latest=$(npm view "$SCOPED" dist-tags.latest "--@j4k-oss:registry=$OSS")
          dist_tag=latest; [ "$forge_latest" = "$VERSION" ] || dist_tag=backfill
          # --ignore-scripts: the package's prepack and prepare scripts cannot run in an unpacked tarball.
          npm publish --ignore-scripts --access public --tag "$dist_tag" --registry https://registry.npmjs.org/
