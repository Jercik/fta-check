---
name: Release

# Required PR status checks are intentionally disabled, so release reruns the
# managed quality suite on the merged revision before publishing.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.repository }}-release-forgejo
  # Never cancel: a run cancelled mid-release can leave a tag without its published artifacts.
  cancel-in-progress: false

# pnpm defaults verify-deps-before-run to "install": the first `pnpm
# <script>` or `pnpm exec` whose deps-status check sees drift re-runs a full
# install with lifecycle scripts enabled, silently dropping this workflow's
# install flags — a prepare hook the hardened --ignore-scripts install skipped
# then runs in CI. Only this spelling disables it: pnpm reads
# pnpm_config_verify_deps_before_run raw from the environment, and the
# npm_config_ spelling is silently ignored.
env:
  pnpm_config_verify_deps_before_run: "false"
  # An in-tree store would put node_modules above the global virtual store's package
  # files and mask dependency-declaration leaks from TypeScript; keep it out of the workspace.
  pnpm_config_store_dir: /tmp/pnpm-store

jobs:
  # Runs queue one at a time, and semantic-release publishes nothing once main has moved on, so on a superseded run this job sets is-tip to false; gate dependent jobs on that output to skip them.
  check-tip:
    name: Check tip
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      is-tip: ${{ steps.tip.outputs.is-tip }}
    steps:
      - name: Compare with the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          refs="$(git -c "http.$GITHUB_SERVER_URL/.extraheader=Authorization: Basic $auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main)"
          # ls-remote patterns are suffix matches, so this also lists refs/heads/*/refs/heads/main.
          tip="$(printf '%s\n' "$refs" | awk -F'\t' '$2 == "refs/heads/main" { print $1 }')"
          if [ -z "$tip" ]; then
            echo "::error::Could not read the tip of main."
            exit 1
          fi
          if [ "$tip" = "$SHA" ]; then
            echo "is-tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping: $SHA is superseded by $tip."
            echo "is-tip=false" >> "$GITHUB_OUTPUT"
          fi

  quality-checks:
    needs: check-tip
    if: needs.check-tip.outputs.is-tip == 'true'
    uses: ./.forgejo/workflows/checks.yml
    with:
      release_gate: true
    secrets: inherit

  release:
    name: Release
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Set on this job only: the npm-mirror job below reads public endpoints only and must not hold a credential that can mint a registry write token, and a workflow-level key would hand it one. Forgejo 16.0.x resolves the job key over the workflow one.
    enable-openid-connect: true
    outputs:
      new-release-version: ${{ steps.release.outputs.version }}
      forge-integrity: ${{ steps.integrity.outputs.integrity }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        # Not setup-node's `cache: pnpm`: the Forgejo runner's cache server lowercases keys and setup-node compares the matched key case-sensitively, so an exact hit never counts as one there and the store is uploaded again. actions/cache compares them case-insensitively.
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Configure registry auth
        env:
          PUBLISH_AUDIENCE: ${{ vars.NPM_PUBLISH_OSS_AUDIENCE }}
          EXPECTED_OWNER: "j4k-oss"
          EXPECTED_NAME: "fta-check"
          EXPECTED_REGISTRY: "https://code.j4k.dev/api/packages/j4k-oss/npm/"
          NPM_READ_AUDIENCE: ${{ vars.NPM_READ_AUDIENCE }}
        run: |
          set -eu
          if [ -z "${PUBLISH_AUDIENCE:-}" ]; then
            echo "::error::NPM_PUBLISH_OSS_AUDIENCE variable is not set. It is the server-generated audience for the org npm-publisher-oss integration; reconcile it from j4k-cluster."
            exit 1
          fi
          if [ -z "${NPM_READ_AUDIENCE:-}" ]; then
            echo "::error::NPM_READ_AUDIENCE variable is not set. It is the server-generated audience for the org npm-reader integration; reconcile it from j4k-cluster."
            exit 1
          fi
          # Fail with a clear message, not a raw curl error, when the OIDC request vars are absent (enable-openid-connect inactive).
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No Actions OIDC token on this run (enable-openid-connect inactive)."
            exit 1
          fi
          # Mint the per-run write:package token for the publish. Forgejo appends
          # `&audience=` to the placeholder-terminated request URL and returns
          # {"value": "<jwt>"}; pnpm ignores env references in credentials it does
          # not expand itself, so the token is written literally into the trusted
          # user-level ~/.npmrc.
          NODE_AUTH_TOKEN="$(
            curl -fsSL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL:-}&audience=${PUBLISH_AUDIENCE}" \
              | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p'
          )"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Failed to obtain an Actions OIDC token for the npm publish."
            exit 1
          fi
          # A curl-fetched token is not auto-masked like a secrets.* value; register it so no later step can print it.
          echo "::add-mask::${NODE_AUTH_TOKEN}"
          # The oss-publisher integration mints for every repository on its claim list and the token writes any package in the org, so assert that this run is the package it is about to publish before the token is used: a repository that is not j4k-oss/fta-check, or a package.json that names another package or registry, must fail here, before anything is tagged or published.
          OIDC_TOKEN="${NODE_AUTH_TOKEN}" node --input-type=module - <<'EOF'
          import { readFileSync } from "node:fs";

          const { OIDC_TOKEN, EXPECTED_OWNER, EXPECTED_NAME, EXPECTED_REGISTRY } = process.env;
          const [, payload = ""] = OIDC_TOKEN.split(".");
          const claims = JSON.parse(Buffer.from(payload, "base64url").toString("utf8"));
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const repositoryName = String(claims.repository).split("/")[1];
          const expected = [
            ["repository_owner claim", claims.repository_owner, EXPECTED_OWNER],
            ["repository claim", claims.repository, EXPECTED_OWNER + "/" + EXPECTED_NAME],
            ["package.json name", manifest.name, "@" + EXPECTED_OWNER + "/" + repositoryName],
            ["package.json name", manifest.name, "@" + EXPECTED_OWNER + "/" + EXPECTED_NAME],
            ["package.json publishConfig.registry", manifest.publishConfig?.registry, EXPECTED_REGISTRY],
          ];
          const mismatches = expected
            .filter(([, actual, wanted]) => actual !== wanted)
            .map(([label, actual, wanted]) => label + " is " + JSON.stringify(actual) + ", expected " + JSON.stringify(wanted));
          if (mismatches.length > 0) {
            console.error("::error::The Actions OIDC token does not name the package this run publishes: " + mismatches.join("; "));
            process.exit(1);
          }
          EOF
          echo "//code.j4k.dev/api/packages/j4k-oss/npm/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          # The publish token identity (oss-publisher) cannot read the private @j4k
          # registry, so a second npm-reader token authenticates the @j4k install
          # line. This credential reads the entire private @j4k registry; it is
          # masked, and the request vars are blanked below so no later step can
          # re-mint — but the token itself stays in ~/.npmrc through the publish
          # (ADR-0009 accepted risk; the install runs --ignore-scripts).
          NODE_AUTH_READ_TOKEN="$(
            curl -fsSL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL:-}&audience=${NPM_READ_AUDIENCE}" \
              | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p'
          )"
          if [ -z "${NODE_AUTH_READ_TOKEN:-}" ]; then
            echo "::error::Failed to obtain an Actions OIDC token for the private registry install."
            exit 1
          fi
          echo "::add-mask::${NODE_AUTH_READ_TOKEN}"
          echo "//code.j4k.dev/api/packages/j4k/npm/:_authToken=${NODE_AUTH_READ_TOKEN}" >> ~/.npmrc
          # The job-level enable-openid-connect exposes ACTIONS_ID_TOKEN_REQUEST_* to every step of this job; blank them so no later step can mint another token.
          printf 'ACTIONS_ID_TOKEN_REQUEST_URL=\nACTIONS_ID_TOKEN_REQUEST_TOKEN=\n' >> "$GITHUB_ENV"

      - name: Install dependencies
        # Dependency install scripts must not run while an npm token is in ~/.npmrc: any dependency's install script could steal the publish token and publish packages with it, or the read token that reaches every package in the private registry; the package's own prepack, if it defines one, still runs when semantic-release publishes it.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Release
        id: release
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec semantic-release
          # The released version is this step's output for later steps and jobs. @j4k/semantic-release-github-output would write it, but that plugin lives in the private registry, which a public package cannot install from. semantic-release tags the released commit before it publishes, so the tag on HEAD names the version, and a rerun of an already released commit finds the same tag.
          # semantic-release never releases one commit twice, so a second release tag on HEAD was pushed by someone else, and choosing between them would let that tag name the version the next step packs and publishes.
          tags="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          case "$tags" in
            "") ;;
            *$'\n'*)
              echo "::error::HEAD carries more than one release tag (${tags//$'\n'/ }), so this run cannot tell which version semantic-release released; nothing is packed or published"
              exit 1
              ;;
            *) echo "version=${tags#v}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish the release tarball and record it
        id: integrity
        if: steps.release.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SCOPED: "@j4k-oss/fta-check"
          OSS: https://code.j4k.dev/api/packages/j4k-oss/npm/
          RELEASE_API: https://code.j4k.dev/api/v1/repos/j4k-oss/fta-check
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir="$GITHUB_WORKSPACE/release-tarball"
          tarballs=("$dir"/*.tgz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            # A rerun of a released commit: semantic-release released nothing, so pack again the way its prepare step does. npm pack is byte-reproducible on the same Node build, and the checks below refuse a tarball that differs from one already published.
            npm version "$VERSION" --no-git-tag-version --allow-same-version > /dev/null
            mkdir -p "$dir"
            npm pack --pack-destination "$dir" --loglevel=warn > /dev/null
            tarballs=("$dir"/*.tgz)
          fi
          [ "${#tarballs[@]}" -eq 1 ] || { echo "::error::expected one tarball of $SCOPED@$VERSION in $dir"; exit 1; }
          tarball="${tarballs[0]}"
          # Publishing a packed file skips the scripts only a folder publish runs; a package that relies on them must fail here instead of shipping without them.
          tar -xzOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{const p=JSON.parse(s);const want=process.env.SCOPED+"@"+process.env.VERSION;if(p.name+"@"+p.version!==want){console.error("::error::the tarball holds "+p.name+"@"+p.version+", not "+want);process.exit(1)}const skipped=["prepublishOnly","prepublish","publish","postpublish"].filter((k)=>p.scripts?.[k]);if(skipped.length>0){console.error("::error::publishing the packed tarball would skip "+skipped.join(", "));process.exit(1)}})'
          integrity="$(node -e 'process.stdout.write("sha512-" + require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
          if ! npm view "$SCOPED@$VERSION" version "--@j4k-oss:registry=$OSS" > /dev/null 2>&1; then
            # A file publish sends the file's bytes unchanged. --ignore-scripts: nothing else may run while the publish token is in ~/.npmrc.
            npm publish "$tarball" --ignore-scripts --tag latest "--@j4k-oss:registry=$OSS"
          fi
          registry_integrity="$(npm view "$SCOPED@$VERSION" dist.integrity "--@j4k-oss:registry=$OSS")"
          [ "$registry_integrity" = "$integrity" ] || { echo "::error::The registry reports $registry_integrity for $SCOPED@$VERSION, not the $integrity of the tarball this job built"; exit 1; }
          served="$RUNNER_TEMP/forge-served"
          mkdir -p "$served"
          (cd "$served" && npm pack "$SCOPED@$VERSION" "--@j4k-oss:registry=$OSS" --loglevel=warn > /dev/null)
          served_tarballs=("$served"/*.tgz)
          [ "${#served_tarballs[@]}" -eq 1 ] || { echo "::error::expected one tarball of $SCOPED@$VERSION in $served"; exit 1; }
          cmp -s "$tarball" "${served_tarballs[0]}" || { echo "::error::The registry serves other bytes for $SCOPED@$VERSION than the tarball this job built"; exit 1; }
          INTEGRITY="$integrity" node --input-type=module - <<'EOF'
          const { VERSION, INTEGRITY, RELEASE_API, FORGEJO_TOKEN } = process.env;
          const ORIGIN = new URL(RELEASE_API).origin;
          if (!/^sha512-[A-Za-z0-9+/]{86}==$/u.test(INTEGRITY ?? "")) {
            console.error("::error::INTEGRITY is " + JSON.stringify(INTEGRITY) + ", not a sha512 integrity");
            process.exit(1);
          }
          async function readRecordedIntegrity(release, origin) {
            const named = (release.assets ?? []).filter((asset) => asset.name === "forge-tarball-integrity.txt");
            if (named.length === 0) {
              return undefined;
            }
            if (named.length > 1) {
              throw new Error("The Forge release " + release.tag_name + " has " + named.length + " assets named forge-tarball-integrity.txt");
            }
            const url = String(named[0].browser_download_url ?? "");
            if (!url.startsWith(origin + "/")) {
              throw new Error("forge-tarball-integrity.txt of " + release.tag_name + " is served from " + JSON.stringify(url) + ", not from " + origin);
            }
            const response = await fetch(url, { signal: AbortSignal.timeout(30_000) });
            if (!response.ok) {
              throw new Error("GET " + url + " returned " + response.status);
            }
            const value = (await response.text()).slice(0, 512).trim();
            if (!/^sha512-[A-Za-z0-9+/]{86}==$/u.test(value)) {
              throw new Error("forge-tarball-integrity.txt of " + release.tag_name + " holds " + JSON.stringify(value.slice(0, 120)) + ", not one sha512 integrity");
            }
            return value;
          }

          async function release(authorized) {
            const url = RELEASE_API + "/releases/tags/v" + VERSION;
            const headers = { accept: "application/json", ...(authorized ? { authorization: "token " + FORGEJO_TOKEN } : {}) };
            const response = await fetch(url, { headers, signal: AbortSignal.timeout(30_000) });
            if (!response.ok) {
              throw new Error("GET " + url + " returned " + response.status);
            }
            return response.json();
          }

          const current = await release(true);
          const recorded = await readRecordedIntegrity(current, ORIGIN);
          if (recorded !== undefined && recorded !== INTEGRITY) {
            console.error("::error::The Forge release v" + VERSION + " already records " + recorded + ", not " + INTEGRITY);
            process.exit(1);
          }
          if (recorded === undefined) {
            const form = new FormData();
            form.append("attachment", new Blob([INTEGRITY + "\n"], { type: "text/plain" }), "forge-tarball-integrity.txt");
            const url = RELEASE_API + "/releases/" + current.id + "/assets?name=forge-tarball-integrity.txt";
            const response = await fetch(url, { method: "POST", headers: { accept: "application/json", authorization: "token " + FORGEJO_TOKEN }, body: form, signal: AbortSignal.timeout(30_000) });
            if (response.status !== 201) {
              throw new Error("POST " + url + " returned " + response.status);
            }
            // Read back the way the GitHub mirror reads it: anonymously.
            if ((await readRecordedIntegrity(await release(false), ORIGIN)) !== INTEGRITY) {
              console.error("::error::The Forge release v" + VERSION + " does not serve the integrity after the upload");
              process.exit(1);
            }
          }
          console.log("ok: the Forge release v" + VERSION + " records " + INTEGRITY);
          EOF
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Save pnpm store
        # Last step, so it saves only after the whole job succeeded. The key comes from the restore step so install cannot change it.
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  # The GitHub mirror copies this release to npmjs from the tag the push mirror delivers, and nothing on the Forge sees that run. This job waits for the version on npmjs, then verifies that copy against the Forge release in the steps below, so a mirror that never ran, or published something else, turns this run red. It is a job here and not a tag-triggered workflow because Forgejo drops events whose actor is the Actions user, and semantic-release pushes its tag as that user. It reads public endpoints only, so it holds no OIDC request credential (see enable-openid-connect on the release job).
  npm-mirror:
    name: Verify npm mirror
    needs: release
    if: needs.release.outputs.new-release-version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NAME: "fta-check"
      SCOPED: "@j4k-oss/fta-check"
      VERSION: ${{ needs.release.outputs.new-release-version }}
      FORGE_INTEGRITY: ${{ needs.release.outputs.forge-integrity }}
      OSS: https://code.j4k.dev/api/packages/j4k-oss/npm/
      MIRROR_OWNER: "Jercik"
      NPM_ACCOUNT: "jercik"
      WORKFLOW_PATH: ".github/workflows/release-npm.yml"
      GITHUB_VISIBILITY: "public"
      TRUSTED_PUBLISHER_ID: "github"
      OIDC_CONFIG_ID: "1f8b8d5b-bd95-4291-8be4-5943ef27938b"
      NPM_ENVIRONMENT: "npm"
      FORGE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.5.0"

      - name: Wait for the version on npmjs
        run: |
          set -euo pipefail
          url="https://registry.npmjs.org/$NAME/$VERSION"
          deadline=$((SECONDS + 1200))
          until [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ]; do
            (( SECONDS < deadline )) || { echo "::error::$NAME@$VERSION is not on npmjs after 20 minutes; check the release-npm.yml runs on GitHub, or dispatch the publish: gh workflow run release-npm.yml -R $MIRROR_OWNER/$NAME --ref refs/heads/main -f tag=v$VERSION"; exit 1; }
            sleep 30
          done

      - name: Check the npm account, publisher, provenance and dist-tag
        run: |
          set -euo pipefail
          # The rule the GitHub publish uses to choose the dist-tag, so a copy published after a newer Forge release is checked under backfill.
          forge_latest="$(npm view "$SCOPED" dist-tags.latest "--@j4k-oss:registry=$OSS")"
          dist_tag=latest; [ "$forge_latest" = "$VERSION" ] || dist_tag=backfill
          EXPECTED_DIST_TAG="$dist_tag" node --input-type=module - <<'EOF'
          import { execFileSync } from "node:child_process";
          import { mkdtempSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";

          const {
            NAME,
            VERSION,
            MIRROR_OWNER,
            NPM_ACCOUNT,
            WORKFLOW_PATH,
            GITHUB_VISIBILITY,
            TRUSTED_PUBLISHER_ID,
            OIDC_CONFIG_ID,
            NPM_ENVIRONMENT,
            FORGE_REPOSITORY_URL,
            EXPECTED_DIST_TAG,
          } = process.env;
          const NPMJS = "https://registry.npmjs.org";
          const MAX_ATTEMPTS = 4;
          const MAX_WAIT_SECONDS = 120;
          const DEFAULT_WAIT_SECONDS = 15;
          const REQUEST_TIMEOUT_MS = 30_000;
          const failures = [];

          function hintedWaitSeconds(response) {
            const retryAfter = response.headers.get("retry-after");
            if (retryAfter !== null) {
              const seconds = Number(retryAfter);
              if (Number.isFinite(seconds)) {
                return seconds;
              }
              const date = Date.parse(retryAfter);
              return Number.isNaN(date) ? undefined : (date - Date.now()) / 1000;
            }
            const reset = Number(response.headers.get("x-ratelimit-reset"));
            return reset > 0 ? reset - Date.now() / 1000 : undefined;
          }

          // 403 and 429 are how GitHub and npm refuse a client over its rate limit; waiting
          // out a short window is the only remedy, and a window longer than the bound fails
          // the job instead of holding the runner.
          async function get(url) {
            for (let attempt = 1; ; attempt += 1) {
              const response = await fetch(url, {
                headers: { accept: "application/json" },
                signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
              });
              const limited = response.status === 403 || response.status === 429;
              const wait = Math.max(hintedWaitSeconds(response) ?? DEFAULT_WAIT_SECONDS, 0);
              if (!limited || attempt === MAX_ATTEMPTS || wait > MAX_WAIT_SECONDS) {
                return { status: response.status, body: response.ok ? await response.json() : undefined };
              }
              console.log("GET " + url + " returned " + response.status + "; retrying in " + Math.ceil(wait) + "s");
              await new Promise((resolve) => setTimeout(resolve, wait * 1000));
            }
          }

          async function getOk(url) {
            const { status, body } = await get(url);
            if (body === undefined) {
              throw new Error("GET " + url + " returned " + status);
            }
            return body;
          }

          function expect(label, actual, wanted) {
            if (JSON.stringify(actual) === JSON.stringify(wanted)) {
              console.log("ok: " + label);
            } else {
              failures.push(label + " is " + JSON.stringify(actual) + ", expected " + JSON.stringify(wanted));
            }
          }

          function gitEnv() {
            return { ...process.env, GIT_TERMINAL_PROMPT: "0" };
          }

          // git resolves ref names and abbreviations too, so "main" or "HEAD" would pass as a commit on main.
          function isOnForgeMain(commit) {
            if (!/^[0-9a-f]{40}$/u.test(commit)) {
              return false;
            }
            const dir = mkdtempSync(join(tmpdir(), "forge-main-"));
            const git = (args) => execFileSync("git", ["-C", dir, ...args], { encoding: "utf8", env: gitEnv() });
            execFileSync("git", ["init", "--quiet", "--bare", dir]);
            git(["fetch", "--quiet", "--filter=blob:none", FORGE_REPOSITORY_URL, "+refs/heads/main:refs/heads/main"]);
            try {
              git(["cat-file", "-e", commit + "^{commit}"]);
            } catch {
              return false;
            }
            try {
              git(["merge-base", "--is-ancestor", commit, "refs/heads/main"]);
              return true;
            } catch (error) {
              if (error.status === 1) {
                return false;
              }
              throw error;
            }
          }

          function verifyProvenance(provenance, integrity) {
            const statement = JSON.parse(Buffer.from(provenance.bundle.dsseEnvelope.payload, "base64").toString("utf8"));
            const digest = /^sha512-(.+)$/u.exec(integrity ?? "");
            expect(
              "provenance subject",
              (statement.subject ?? []).map((subject) => [subject.name, subject.digest?.sha512]),
              [["pkg:npm/" + NAME + "@" + VERSION, digest === null ? "no sha512 integrity" : Buffer.from(digest[1], "base64").toString("hex")]],
            );
            const workflow = statement.predicate.buildDefinition.externalParameters.workflow;
            expect("provenance repository and workflow", [workflow.repository, workflow.path], ["https://github.com/" + MIRROR_OWNER + "/" + NAME, WORKFLOW_PATH]);
            expect("provenance workflow ref", workflow.ref, "refs/heads/main");
            expect("provenance trigger", statement.predicate.buildDefinition.internalParameters?.github?.event_name, "workflow_dispatch");
            const commit = (statement.predicate.buildDefinition.resolvedDependencies ?? []).find((dependency) => dependency.digest?.gitCommit !== undefined)?.digest.gitCommit;
            // The run's workflow file comes from the GitHub main commit it ran on; that commit must be one the Forge's protected main holds.
            expect("provenance commit " + commit + " is on Forge main", commit !== undefined && isOnForgeMain(commit), true);
          }

          expect("npmjs collaborators of " + NAME, await getOk(NPMJS + "/-/package/" + NAME + "/collaborators"), Object.fromEntries([[NPM_ACCOUNT, "write"]]));

          const manifest = await getOk(NPMJS + "/" + NAME + "/" + VERSION);
          expect("maintainers of " + NAME + "@" + VERSION, (manifest.maintainers ?? []).map((maintainer) => maintainer.name), [NPM_ACCOUNT]);
          const publisher = manifest._npmUser;
          expect("_npmUser of " + NAME + "@" + VERSION, publisher?.name + " <" + publisher?.email + ">", "GitHub Actions <npm-oidc-no-reply@github.com>");
          expect("trusted publisher of " + NAME + "@" + VERSION, [publisher?.trustedPublisher?.id, publisher?.trustedPublisher?.oidcConfigId], [TRUSTED_PUBLISHER_ID, OIDC_CONFIG_ID]);

          // Visibility comes from policy, not from what the probe answers: npm attaches provenance only to a publish from a public repository, so a public package whose repository now answers 404 must fail instead of passing as private.
          if (GITHUB_VISIBILITY !== "public" && GITHUB_VISIBILITY !== "private") {
            throw new Error("GITHUB_VISIBILITY is " + JSON.stringify(GITHUB_VISIBILITY) + ", expected public or private");
          }
          const repository = await get("https://api.github.com/repos/" + MIRROR_OWNER + "/" + NAME);
          if (repository.status === 200 && typeof repository.body.private !== "boolean") {
            throw new Error("GitHub answered for " + MIRROR_OWNER + "/" + NAME + " without a private flag");
          }
          if (repository.status !== 200 && repository.status !== 404) {
            throw new Error("GET https://api.github.com/repos/" + MIRROR_OWNER + "/" + NAME + " returned " + repository.status + "; cannot tell whether the mirror repository is public");
          }
          expect(
            "anonymous GitHub view of " + MIRROR_OWNER + "/" + NAME,
            repository.status === 200 && repository.body.private === false ? "public" : "hidden",
            GITHUB_VISIBILITY === "public" ? "public" : "hidden",
          );

          if (GITHUB_VISIBILITY === "public") {
            const base = "https://api.github.com/repos/" + MIRROR_OWNER + "/" + NAME + "/environments/" + NPM_ENVIRONMENT;
            const environment = await getOk(base);
            expect("deployment branch policy of environment " + NPM_ENVIRONMENT, environment.deployment_branch_policy, { protected_branches: false, custom_branch_policies: true });
            const rules = await getOk(base + "/deployment-branch-policies");
            expect("deployment branch rules of environment " + NPM_ENVIRONMENT, (rules.branch_policies ?? []).map((rule) => [rule.type, rule.name]), [["branch", "main"]]);
          } else {
            console.log("skipped: the environment " + NPM_ENVIRONMENT + " of a private mirror is not readable anonymously; the operator checks it");
          }

          // git ls-remote prints "<sha>\t<ref>"; split on the tab. The Forge refuses such tags (a protected-tag rule), and this job cannot read the admin-only protection list, so it checks the effect instead.
          const foreignTags = execFileSync("git", ["ls-remote", "--tags", "--refs", FORGE_REPOSITORY_URL], { encoding: "utf8", env: gitEnv() })
            .split("\n")
            .filter((line) => line !== "")
            .map((line) => line.split("\t")[1].slice("refs/tags/".length))
            .filter((name) => !name.startsWith("v"));
          expect("Forge tags that do not start with v", foreignTags, []);

          // Checked whenever npmjs holds attestations, so a private package that somehow carries one is bound too.
          const attestations = await get(NPMJS + "/-/npm/v1/attestations/" + NAME + "@" + VERSION);
          if (attestations.status !== 200 && attestations.status !== 404) {
            throw new Error("GET " + NPMJS + "/-/npm/v1/attestations/" + NAME + "@" + VERSION + " returned " + attestations.status);
          }
          const provenance = (attestations.body?.attestations ?? []).find((attestation) => attestation.predicateType === "https://slsa.dev/provenance/v1");
          if (provenance !== undefined) {
            verifyProvenance(provenance, manifest.dist?.integrity);
          } else if (GITHUB_VISIBILITY === "public") {
            failures.push("npmjs holds no SLSA provenance for " + NAME + "@" + VERSION);
          }

          const expectedDistTag = EXPECTED_DIST_TAG === undefined || EXPECTED_DIST_TAG === "" ? "latest" : EXPECTED_DIST_TAG;
          expect("dist-tags." + expectedDistTag + " of " + NAME, (await getOk(NPMJS + "/-/package/" + NAME + "/dist-tags"))[expectedDistTag], VERSION);

          for (const failure of failures) {
            console.error("::error::" + failure);
          }
          process.exit(failures.length > 0 ? 1 : 0);
          EOF

      - name: Compare the npm tarball with the Forge release
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compare"
          mkdir -p "$work/npm" "$work/forge"
          (cd "$work/npm" && npm pack "$NAME@$VERSION" --registry https://registry.npmjs.org/ --loglevel=warn > /dev/null)
          (cd "$work/forge" && npm pack "$SCOPED@$VERSION" "--@j4k-oss:registry=$OSS" --loglevel=warn > /dev/null)
          npm_tarballs=("$work"/npm/*.tgz)
          forge_tarballs=("$work"/forge/*.tgz)
          [ "${#npm_tarballs[@]}" -eq 1 ] && [ "${#forge_tarballs[@]}" -eq 1 ] || { echo "::error::expected one tarball per registry in $work"; exit 1; }
          # The release job recorded the integrity of the tarball it published; the Forge registry must still serve exactly those bytes, or the copy would be compared against something nobody released.
          forge_integrity="$(node -e 'process.stdout.write("sha512-" + require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(process.argv[1])).digest("base64"))' "${forge_tarballs[0]}")"
          [ "$forge_integrity" = "$FORGE_INTEGRITY" ] || { echo "::error::The Forge tarball of $SCOPED@$VERSION has integrity $forge_integrity, not the $FORGE_INTEGRITY its release job published"; exit 1; }
          REPOSITORY_URL="git+https://github.com/$MIRROR_OWNER/$NAME.git" node --input-type=module - "${npm_tarballs[0]}" "${forge_tarballs[0]}" <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { isDeepStrictEqual } from "node:util";
          import { gunzipSync } from "node:zlib";

          const BLOCK_SIZE = 512;
          const MANIFEST_PATH = "package/package.json";
          const FILE_TYPES = new Set(["0", "\0", "7"]);
          const MEMBER_TYPES = new Set([...FILE_TYPES, "1", "2", "5"]);

          function readText(bytes) {
            const end = bytes.indexOf(0);
            return bytes.subarray(0, end === -1 ? bytes.length : end).toString("utf8");
          }

          function readOctal(bytes, field) {
            if ((bytes[0] ?? 0) & 0x80) {
              throw new Error("tar " + field + " uses the base-256 encoding, which npm tarballs never need");
            }
            const text = readText(bytes).trim();
            if (!/^[0-7]*$/u.test(text)) {
              throw new Error("tar " + field + " is not octal: " + JSON.stringify(text));
            }
            return text === "" ? 0 : Number.parseInt(text, 8);
          }

          function checksum(header) {
            let sum = 0;
            for (let index = 0; index < BLOCK_SIZE; index += 1) {
              sum += index >= 148 && index < 156 ? 0x20 : header[index];
            }
            return sum;
          }

          function parsePax(body) {
            const records = {};
            let offset = 0;
            while (offset < body.length) {
              const space = body.indexOf(0x20, offset);
              const length = Number.parseInt(body.subarray(offset, space).toString("utf8"), 10);
              if (space === -1 || !Number.isInteger(length) || length <= space - offset + 1 || offset + length > body.length) {
                throw new Error("tar has a malformed pax header");
              }
              const record = body.subarray(space + 1, offset + length - 1).toString("utf8");
              const equals = record.indexOf("=");
              records[record.slice(0, equals)] = record.slice(equals + 1);
              offset += length;
            }
            return records;
          }

          function readArchive(file) {
            const data = gunzipSync(readFileSync(file));
            const members = new Map();
            let offset = 0;
            let pax = {};
            let longPath;
            let longLink;
            let ended = false;
            while (offset + BLOCK_SIZE <= data.length) {
              const header = data.subarray(offset, offset + BLOCK_SIZE);
              if (header.every((byte) => byte === 0)) {
                ended = true;
                break;
              }
              if (readOctal(header.subarray(148, 156), "checksum") !== checksum(header)) {
                throw new Error("tar header at byte " + offset + " fails its checksum");
              }
              const size = readOctal(header.subarray(124, 136), "size");
              const type = String.fromCharCode(header[156]);
              const bodyStart = offset + BLOCK_SIZE;
              if (bodyStart + size > data.length) {
                throw new Error("tar is truncated inside a member");
              }
              const body = data.subarray(bodyStart, bodyStart + size);
              offset = bodyStart + Math.ceil(size / BLOCK_SIZE) * BLOCK_SIZE;
              if (type === "x") {
                pax = { ...pax, ...parsePax(body) };
                continue;
              }
              if (type === "L") {
                longPath = readText(body);
                continue;
              }
              if (type === "K") {
                longLink = readText(body);
                continue;
              }
              if (!MEMBER_TYPES.has(type)) {
                throw new Error("tar member of unsupported type " + JSON.stringify(type));
              }
              if (pax.size !== undefined) {
                throw new Error("tar pax size overrides are not supported");
              }
              const prefix = readText(header.subarray(345, 500));
              const ustar = readText(header.subarray(257, 263)) === "ustar";
              const name = pax.path ?? longPath ?? (ustar && prefix !== "" ? prefix + "/" : "") + readText(header.subarray(0, 100));
              if (members.has(name)) {
                throw new Error("tar holds " + name + " twice");
              }
              members.set(name, {
                type: FILE_TYPES.has(type) ? "file" : type,
                mode: readOctal(header.subarray(100, 108), "mode") & 0o7777,
                link: pax.linkpath ?? longLink ?? readText(header.subarray(157, 257)),
                sha256: createHash("sha256").update(body).digest("hex"),
                body,
              });
              pax = {};
              longPath = undefined;
              longLink = undefined;
            }
            if (!ended) {
              throw new Error(file + " has no tar end marker; it is truncated or not a tar archive");
            }
            if (members.size === 0) {
              throw new Error(file + " holds no members");
            }
            return members;
          }

          function describe(member) {
            return member.type + " mode " + member.mode.toString(8) + " sha256 " + member.sha256 + (member.link === "" ? "" : " -> " + member.link);
          }

          const { NAME, SCOPED, REPOSITORY_URL } = process.env;
          const [mirrorFile, forgeFile] = process.argv.slice(2);
          const mirror = readArchive(mirrorFile);
          const forge = readArchive(forgeFile);
          const failures = [];

          for (const path of new Set([...mirror.keys(), ...forge.keys()])) {
            const mirrored = mirror.get(path);
            const released = forge.get(path);
            if (mirrored === undefined || released === undefined) {
              failures.push(path + " is only in the " + (mirrored === undefined ? "Forge" : "npm") + " tarball");
            } else if (path !== MANIFEST_PATH && describe(mirrored) !== describe(released)) {
              failures.push(path + " differs: npm " + describe(mirrored) + ", Forge " + describe(released));
            } else if (path === MANIFEST_PATH && (mirrored.type !== "file" || released.type !== "file" || mirrored.mode !== released.mode)) {
              failures.push(path + " differs in type or mode: npm " + describe(mirrored) + ", Forge " + describe(released));
            }
          }

          const mirroredManifest = mirror.get(MANIFEST_PATH);
          const releasedManifest = forge.get(MANIFEST_PATH);
          if (mirroredManifest !== undefined && releasedManifest !== undefined) {
            const npm = JSON.parse(mirroredManifest.body.toString("utf8"));
            const released = JSON.parse(releasedManifest.body.toString("utf8"));
            if (npm.name !== NAME || released.name !== SCOPED) {
              failures.push("package names are " + npm.name + " (npm) and " + released.name + " (Forge), expected " + NAME + " and " + SCOPED);
            }
            if (npm.repository?.url !== REPOSITORY_URL) {
              failures.push("npm repository.url is " + npm.repository?.url + ", expected " + REPOSITORY_URL);
            }
            if (npm.publishConfig !== undefined) {
              failures.push("the npm copy kept publishConfig");
            }
            for (const manifest of [npm, released]) {
              delete manifest.name;
              delete manifest.repository?.url;
              delete manifest.publishConfig;
            }
            if (!isDeepStrictEqual(npm, released)) {
              failures.push("package.json differs beyond name, repository.url and publishConfig");
            }
          }

          for (const failure of failures) {
            console.error("::error::" + failure);
          }
          if (failures.length > 0) {
            process.exit(1);
          }
          console.log("ok: " + mirror.size + " archive members match, package.json differs only in name, repository.url and publishConfig");
          EOF
